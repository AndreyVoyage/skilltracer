version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: skilltracer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skilltracer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-skilltracer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skilltracer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skilltracer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: skilltracer-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-skilltracer}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-skilltracer}
      SECRET_KEY: ${SECRET_KEY:-changeme}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_API_TOKEN: ${BOT_API_TOKEN}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    networks:
      - skilltracer-network
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - media_uploads:/app/media
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  bot:
    build: ./bot
    container_name: skilltracer-bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_API_TOKEN: ${BOT_API_TOKEN}
      BACKEND_URL: http://backend:8000
    networks:
      - skilltracer-network
    depends_on:
      - backend
    # No volume mount in production

  frontend:
    build: ./frontend
    container_name: skilltracer-frontend
    restart: unless-stopped
    networks:
      - skilltracer-network
    depends_on:
      - backend
    # Build static files in Dockerfile, served by Nginx

  nginx:
    image: nginx:alpine
    container_name: skilltracer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./certbot/www:/var/www/certbot:ro
      - certbot-data:/etc/letsencrypt
    networks:
      - skilltracer-network
    depends_on:
      - backend

volumes:
  postgres_data:
  certbot-data:
  media_uploads:

networks:
  skilltracer-network:
    driver: bridge
