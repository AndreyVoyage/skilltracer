# =============================================================================
# Skill Tracer - Docker Compose Configuration
# Оптимизировано для Reg.ru Host-0 (13GB диска)
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL 15 Database
  # Критично для Host-0: ограничение памяти 512MB
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: skilltracer_postgres
    restart: always
    # Порт 5432 только для внутренней сети (не выставляется наружу!)
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skilluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillpass}
      POSTGRES_DB: skilltracer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Лимиты ресурсов для Host-0
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - skilltracer_network

  # ===========================================================================
  # FastAPI Backend
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skilltracer_backend
    restart: always
    # Порт 8000 только внутренний (проксируется через Caddy)
    expose:
      - "8000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://skilluser:skillpass@postgres:5432/skilltracer}
      - WEBAPP_URL=${WEBAPP_URL:-http://localhost}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - TELEGRAM_PROXY=${TELEGRAM_PROXY}
    volumes:
      # Том для логов (ограниченный размер через log rotation в приложении)
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skilltracer_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Caddy Reverse Proxy
  # Автоматический HTTPS, меньше конфигурации чем Nginx
  # ===========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: skilltracer_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - skilltracer_network

# =============================================================================
# Volumes (персистентные данные)
# =============================================================================
volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  backend_logs:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  skilltracer_network:
    driver: bridge
